# HTTPS : Caddy reçoit les connexions et les transmet à l'application. Voir docs/HTTPS.md.
# Activation, dans .env : COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml
services:
  web:
    ports: !reset []   # l'application n'est plus joignable en HTTP depuis le réseau
    environment:
      # Le blocage après échecs de connexion (django-axes, #19) lit l'adresse du poste transmise par Caddy.
      AXES_BEHIND_PROXY: "1"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Le dossier, pas le fichier : « git checkout » remplace le Caddyfile par un nouveau fichier,
      # qu'un montage de fichier ne verrait pas (le conteneur garderait l'ancien).
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data   # certificats : à conserver d'un redémarrage à l'autre
    depends_on:
      - web
volumes:
  caddy_data:
