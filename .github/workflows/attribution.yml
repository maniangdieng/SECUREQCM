# Règle d'équipe : chaque commit est signé du nom de son auteur humain.
# Aucun outil (assistant de code, générateur…) ne doit apparaître comme auteur,
# committer ou co-auteur dans l'historique du dépôt.
name: Attribution des commits

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  attribution:
    name: Auteurs des commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier auteurs et messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Premier push d'une branche : « before » vaut 000… ; on ne vérifie alors que le dernier commit.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then RANGE="$HEAD_SHA^!"; else RANGE="$BASE_SHA..$HEAD_SHA"; fi
          bad=0
          for sha in $(git rev-list "$RANGE"); do
            who=$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$sha")
            if grep -qiE '^claude( |$)|anthropic\.com' <<<"$who"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") : auteur ou committer non autorisé ($(head -1 <<<"$who"))"
              bad=1
            fi
            lines=$(git log -1 --format='%B' "$sha" | grep -iE '^co-authored-by:.*(claude|anthropic)|^claude-session:|generated with \[?claude' || true)
            if [[ -n "$lines" ]]; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") : mention d'outil dans le message -> $lines"
              bad=1
            fi
          done
          if [[ $bad -ne 0 ]]; then
            echo "Corrigez l'auteur (git config user.name / user.email) et retirez les lignes Co-Authored-By / Claude-Session,"
            echo "par exemple avec : git rebase -i <base> puis « reword » / « git commit --amend --reset-author »."
            exit 1
          fi
          echo "OK : $(git rev-list --count "$RANGE") commit(s) vérifié(s)."
